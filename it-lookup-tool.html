<!DOCTYPE html>
<!--
  ============================================================
  IT LOOKUP TOOL — Mock Version
  Built for: Xeng's first web app session
  ============================================================

  A web page is made of 3 parts:
    1. HTML  → the structure (what's on the page)
    2. CSS   → the styling (how it looks)
    3. JS    → the logic (what it does)

  All 3 live in this single file for now. Later, you'd split
  them into separate files as the app grows.
  ============================================================
-->
<html lang="en">

<!-- ========================
     HEAD — setup stuff
     (not visible on the page)
     ======================== -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Lookup Tool</title>

  <!-- Google Fonts — loading a nice font from the internet -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- ========================
       CSS — all the styling
       ======================== -->
  <style>

    /* CSS Variables — a set of colors we'll reuse throughout.
       Think of these like named constants in code. */
    :root {
      --bg:        #0f1117;   /* dark background */
      --surface:   #1a1d27;   /* card background */
      --border:    #2e3147;   /* border color */
      --accent:    #4f8ef7;   /* blue highlight */
      --accent2:   #22d3a5;   /* green highlight */
      --warn:      #f7854f;   /* orange for alerts */
      --text:      #e2e8f0;   /* main text */
      --muted:     #6b7280;   /* dimmed text */
      --font-main: 'IBM Plex Sans', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    /* Reset — remove browser default spacing */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Body — overall page setup */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* ---- Layout ---- */
    .container {
      max-width: 760px;
      margin: 0 auto;  /* centers the container */
    }

    /* ---- Header ---- */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }
    .logo {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    header p {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    /* ---- Search Bar ---- */
    .search-wrap {
      position: relative;
      margin-bottom: 28px;
    }
    .search-wrap input {
      width: 100%;
      padding: 14px 18px 14px 48px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: var(--font-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    /* When the user clicks the input, highlight the border */
    .search-wrap input:focus {
      border-color: var(--accent);
    }
    .search-icon {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
      pointer-events: none; /* so clicking the icon still focuses the input */
    }

    /* ---- Hint text below search ---- */
    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: var(--font-mono);
      margin-top: 8px;
      margin-left: 4px;
    }
    .hint span {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
    }

    /* ---- Results Section ---- */
    #results {
      display: none; /* hidden by default — JS will show it */
    }

    /* Section label */
    .section-label {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    /* ---- User Card ---- */
    .user-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 18px;
      animation: fadeIn 0.3s ease; /* subtle fade-in when it appears */
    }
    /* User avatar circle */
    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      font-weight: 600;
      flex-shrink: 0; /* don't let it squish */
    }
    .user-info h2 {
      font-size: 1rem;
      font-weight: 600;
    }
    .user-info p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 2px;
    }
    /* Status badge */
    .badge {
      margin-left: auto; /* pushes badge to the right */
      font-size: 0.7rem;
      font-family: var(--font-mono);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge.active  { background: rgba(34,211,165,0.15); color: var(--accent2); }
    .badge.offline { background: rgba(107,114,128,0.2);  color: var(--muted); }

    /* ---- Device Details Grid ---- */
    .device-grid {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2 equal columns */
      gap: 12px;
      margin-bottom: 24px;
    }
    .device-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      animation: fadeIn 0.3s ease 0.1s both; /* slight delay for staggered feel */
    }
    .device-item .label {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .device-item .value {
      font-size: 0.95rem;
      font-weight: 500;
    }
    /* Color specific values for quick scanning */
    .value.ok     { color: var(--accent2); }
    .value.warn   { color: var(--warn); }
    .value.mono   { font-family: var(--font-mono); font-size: 0.85rem; }

    /* ---- Ticket Section ---- */
    .ticket-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease 0.2s both;
    }
    .ticket-section h3 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    /* Ticket type buttons */
    .ticket-types {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .ticket-btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: var(--font-main);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    /* When a ticket type is selected */
    .ticket-btn.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .ticket-btn:hover:not(.selected) {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Notes textarea */
    .ticket-section textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-main);
      font-size: 0.88rem;
      resize: vertical; /* allow vertical resizing only */
      min-height: 80px;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .ticket-section textarea:focus {
      border-color: var(--accent);
    }

    /* Submit button */
    .btn-submit {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: var(--font-main);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-submit:hover  { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.98); }

    /* ---- Success message (shown after ticket submit) ---- */
    .success-toast {
      display: none;   /* hidden by default */
      background: rgba(34,211,165,0.1);
      border: 1px solid var(--accent2);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.88rem;
      color: var(--accent2);
      margin-top: 12px;
      font-family: var(--font-mono);
      animation: fadeIn 0.3s ease;
    }

    /* ---- No results message ---- */
    #no-results {
      display: none;
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.88rem;
    }

    /* ---- Animations ---- */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>

<!-- ========================
     BODY — the visible page
     ======================== -->
<body>
<div class="container">

  <!-- Header -->
  <header>
    <div class="logo">🔧</div>
    <div>
      <h1>IT Lookup Tool</h1>
      <p>mock data — v0.1 — built by xeng</p>
    </div>
  </header>

  <!-- Search Bar
       oninput="searchUser()" means: every time the user types,
       run the searchUser() function (defined in JS below) -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      id="search-input"
      placeholder="Search by name or username..."
      oninput="searchUser()"
    />
  </div>
  <p class="hint">
    Try searching:
    <span onclick="quickSearch('sarah')">sarah</span>,
    <span onclick="quickSearch('marcus')">marcus</span>, or
    <span onclick="quickSearch('lin')">lin</span>
  </p>

  <!-- No results message (shown by JS if search finds nothing) -->
  <div id="no-results">⚠ no user found — try a different name</div>

  <!-- Results section (hidden until a search returns a match) -->
  <div id="results">

    <!-- User Card -->
    <p class="section-label" style="margin-top:28px;">User</p>
    <div class="user-card">
      <div class="avatar" id="user-avatar"></div>
      <div class="user-info">
        <h2 id="user-name"></h2>
        <p id="user-meta"></p>
      </div>
      <span class="badge" id="user-status"></span>
    </div>

    <!-- Device Details -->
    <p class="section-label">Device Details</p>
    <div class="device-grid">
      <div class="device-item">
        <div class="label">Hostname</div>
        <div class="value mono" id="d-hostname"></div>
      </div>
      <div class="device-item">
        <div class="label">Operating System</div>
        <div class="value" id="d-os"></div>
      </div>
      <div class="device-item">
        <div class="label">Last Seen</div>
        <div class="value" id="d-lastseen"></div>
      </div>
      <div class="device-item">
        <div class="label">Disk Usage</div>
        <div class="value" id="d-disk"></div>
      </div>
      <div class="device-item">
        <div class="label">RAM</div>
        <div class="value" id="d-ram"></div>
      </div>
      <div class="device-item">
        <div class="label">Antivirus</div>
        <div class="value" id="d-av"></div>
      </div>
    </div>

    <!-- Create Ticket -->
    <p class="section-label">Create Ticket</p>
    <div class="ticket-section">
      <h3>Select issue type</h3>

      <!-- Ticket type buttons — clicking one calls selectTicket() -->
      <div class="ticket-types">
        <button class="ticket-btn" onclick="selectTicket(this)">Password Reset</button>
        <button class="ticket-btn" onclick="selectTicket(this)">Software Install</button>
        <button class="ticket-btn" onclick="selectTicket(this)">Hardware Issue</button>
        <button class="ticket-btn" onclick="selectTicket(this)">Network Problem</button>
        <button class="ticket-btn" onclick="selectTicket(this)">Other</button>
      </div>

      <textarea id="ticket-notes" placeholder="Add notes (optional)..."></textarea>

      <button class="btn-submit" onclick="submitTicket()">
        <span>🎫</span> Submit Ticket
      </button>

      <!-- Success message — shown after ticket is submitted -->
      <div class="success-toast" id="ticket-success"></div>
    </div>

  </div><!-- end #results -->

</div><!-- end .container -->


<!-- ========================
     JAVASCRIPT — the logic
     ======================== -->
<script>

  // -------------------------------------------------------
  // MOCK DATA
  // This is our fake "database" — an array of user objects.
  // In a real app, this would come from a server/API call.
  // An array uses [] and each user is an object using {}.
  // -------------------------------------------------------
  const users = [
    {
      name:     "Sarah Chen",
      username: "s.chen",
      dept:     "Finance · Floor 3",
      status:   "active",
      device: {
        hostname: "FIN-SCHEN-01",
        os:       "Windows 11 Pro",
        lastseen: "Today, 9:41 AM",
        disk:     "72% used",
        diskWarn: true,   // flag we'll use to color it orange
        ram:      "16 GB",
        av:       "Up to date",
      }
    },
    {
      name:     "Marcus Williams",
      username: "m.williams",
      dept:     "Engineering · Floor 5",
      status:   "active",
      device: {
        hostname: "ENG-MWILL-02",
        os:       "macOS Sequoia",
        lastseen: "Today, 11:02 AM",
        disk:     "38% used",
        diskWarn: false,
        ram:      "32 GB",
        av:       "Up to date",
      }
    },
    {
      name:     "Lin Torres",
      username: "l.torres",
      dept:     "HR · Floor 2",
      status:   "offline",
      device: {
        hostname: "HR-LTORR-01",
        os:       "Windows 10 Pro",
        lastseen: "Yesterday, 5:18 PM",
        disk:     "51% used",
        diskWarn: false,
        ram:      "8 GB",
        av:       "⚠ Outdated",
        avWarn:   true,
      }
    },
    {
      name:     "James Okafor",
      username: "j.okafor",
      dept:     "IT · Floor 1",
      status:   "active",
      device: {
        hostname: "IT-JOKAF-03",
        os:       "Windows 11 Pro",
        lastseen: "Today, 8:55 AM",
        disk:     "29% used",
        diskWarn: false,
        ram:      "16 GB",
        av:       "Up to date",
      }
    }
  ];


  // -------------------------------------------------------
  // SEARCH FUNCTION
  // Runs every time the user types in the search box.
  // It looks through the users array for a name match.
  // -------------------------------------------------------
  function searchUser() {

    // Get what the user typed, convert to lowercase for easy comparison
    const query = document.getElementById('search-input').value.toLowerCase().trim();

    // Get references to our HTML elements
    const resultsDiv  = document.getElementById('results');
    const noResults   = document.getElementById('no-results');

    // If the search box is empty, hide everything and stop
    if (query === '') {
      resultsDiv.style.display  = 'none';
      noResults.style.display   = 'none';
      return; // stop the function here
    }

    // Search the array: find() returns the first match, or undefined
    // We check if the user's name OR username contains the query
    const match = users.find(u =>
      u.name.toLowerCase().includes(query) ||
      u.username.toLowerCase().includes(query)
    );

    if (match) {
      // We found a user — show their data
      noResults.style.display  = 'none';
      resultsDiv.style.display = 'block';
      populateResults(match); // call the function below
    } else {
      // No match — show the "not found" message
      resultsDiv.style.display  = 'none';
      noResults.style.display   = 'block';
    }
  }


  // -------------------------------------------------------
  // POPULATE RESULTS
  // Takes a user object and fills in all the HTML elements.
  // document.getElementById() finds an element by its id.
  // .textContent = sets the text inside that element.
  // -------------------------------------------------------
  function populateResults(user) {

    // User card
    document.getElementById('user-avatar').textContent =
      user.name.split(' ').map(w => w[0]).join(''); // initials: "Sarah Chen" → "SC"

    document.getElementById('user-name').textContent = user.name;
    document.getElementById('user-meta').textContent = `@${user.username} · ${user.dept}`;

    const statusEl = document.getElementById('user-status');
    statusEl.textContent  = user.status === 'active' ? '● Active' : '○ Offline';
    statusEl.className    = `badge ${user.status}`; // applies the right CSS class

    // Device details
    document.getElementById('d-hostname').textContent = user.device.hostname;
    document.getElementById('d-os').textContent       = user.device.os;
    document.getElementById('d-lastseen').textContent = user.device.lastseen;
    document.getElementById('d-ram').textContent      = user.device.ram;

    // Disk — color it orange if usage is high
    const diskEl = document.getElementById('d-disk');
    diskEl.textContent = user.device.disk;
    diskEl.className   = user.device.diskWarn ? 'value warn' : 'value ok';

    // Antivirus — color it orange if outdated
    const avEl = document.getElementById('d-av');
    avEl.textContent = user.device.av;
    avEl.className   = user.device.avWarn ? 'value warn' : 'value ok';

    // Reset the ticket section when a new user is loaded
    resetTicket();
  }


  // -------------------------------------------------------
  // QUICK SEARCH (the clickable hint links)
  // Sets the input value and triggers searchUser()
  // -------------------------------------------------------
  function quickSearch(name) {
    document.getElementById('search-input').value = name;
    searchUser();
  }


  // -------------------------------------------------------
  // TICKET FUNCTIONS
  // -------------------------------------------------------

  // Track which ticket type is selected
  let selectedTicketType = null;

  // Called when a ticket type button is clicked
  function selectTicket(btn) {
    // Remove 'selected' from all buttons first
    document.querySelectorAll('.ticket-btn').forEach(b => b.classList.remove('selected'));
    // Add 'selected' to the one that was clicked
    btn.classList.add('selected');
    selectedTicketType = btn.textContent;
  }

  // Called when Submit is clicked
  function submitTicket() {
    const notes    = document.getElementById('ticket-notes').value.trim();
    const userName = document.getElementById('user-name').textContent;
    const toast    = document.getElementById('ticket-success');

    if (!selectedTicketType) {
      alert('Please select an issue type first.');
      return;
    }

    // Generate a fake ticket ID (random 5-digit number)
    const ticketId = 'TKT-' + Math.floor(10000 + Math.random() * 90000);

    // Show the success message
    toast.style.display = 'block';
    toast.textContent   =
      `✓ ${ticketId} created for ${userName} · "${selectedTicketType}"` +
      (notes ? ` · Notes: "${notes}"` : '');
  }

  // Resets ticket section (called when a new user is searched)
  function resetTicket() {
    selectedTicketType = null;
    document.querySelectorAll('.ticket-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('ticket-notes').value  = '';
    document.getElementById('ticket-success').style.display = 'none';
  }

</script>
</body>
</html>
